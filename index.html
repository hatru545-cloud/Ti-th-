<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1628">
<title>Ti thể – Nhà máy năng lượng của tế bào | Mô phỏng 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03050d;--cyan:#35f2ff;--mag:#ff4fd8;--amber:#ffc94a;--lime:#8dff6a;--red:#ff6a4a;
  --panel:rgba(9,14,32,.68);--stroke:rgba(130,205,255,.22);--text:#e9f2ff;--muted:#9db3d6;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  border:1px solid var(--stroke);border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- Thương hiệu ---------- */
.brand{position:fixed;left:18px;top:16px;z-index:20;display:flex;gap:12px;align-items:center;pointer-events:none}
.brand .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,#ff4fd8,#35f2ff);box-shadow:0 0 26px rgba(53,242,255,.55)}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.16em;text-shadow:0 0 18px rgba(53,242,255,.6)}
.brand p{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- Chuyển chế độ ---------- */
.modes{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:4px;padding:5px;border-radius:999px}
.modes button{display:flex;align-items:center;gap:8px;border:0;cursor:pointer;color:var(--muted);background:transparent;
  padding:10px 18px;border-radius:999px;font-family:inherit;font-weight:600;font-size:14px;transition:.3s;white-space:nowrap}
.modes button .ico{font-size:17px}
.modes button:hover{color:#fff}
.modes button.active{color:#06101c;background:linear-gradient(120deg,var(--cyan),#7aa8ff);box-shadow:0 0 22px rgba(53,242,255,.55)}
.modes button[data-mode="2"].active{background:linear-gradient(120deg,#ffb23a,#ff6a4a);box-shadow:0 0 22px rgba(255,150,60,.6)}
.l-short,.t-short{display:none}

/* ---------- Điều khiển ---------- */
.controls{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:8px;
  border-radius:20px;max-width:calc(100vw - 16px)}
.tg{display:flex;align-items:center;gap:8px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);
  padding:9px 12px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:.25s;white-space:nowrap}
.tg:hover{background:rgba(255,255,255,.1)}
.tg .sw{width:30px;height:17px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.25s;flex:none}
.tg .sw::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#cfe0ff;transition:.25s}
.tg[aria-pressed="true"] .sw{background:linear-gradient(90deg,var(--cyan),#6ea0ff)}
.tg[aria-pressed="true"] .sw::after{left:15px;background:#fff;box-shadow:0 0 8px #fff}
.tg.quiz{background:linear-gradient(120deg,var(--mag),#8a5bff);border-color:transparent;box-shadow:0 0 22px rgba(255,79,216,.45)}
.tg.quiz:hover{filter:brightness(1.15)}

/* ---------- Chú giải ---------- */
.legend{position:fixed;left:16px;bottom:16px;z-index:20;padding:12px 14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;max-width:230px}
.legend div{display:flex;align-items:center;gap:8px;color:var(--text)}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 20px var(--c)}
.legend small{line-height:1.45;margin-top:4px;border-top:1px solid var(--stroke);padding-top:8px}

/* ---------- Nhãn 3D ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.hs{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .4s;will-change:transform;transform:translate3d(-999px,-999px,0)}
.hs .dot,.hs .tag{position:absolute;pointer-events:none;cursor:pointer}
.hs.on .dot,.hs.on .tag{pointer-events:auto}
.hs.on{opacity:1}
.hs .dot{left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c),0 0 34px var(--c)}
.hs .dot::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
.hs .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--c);animation:ping 1.9s ease-out infinite}
.hs .tag{left:18px;top:-15px;padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;color:#fff;
  background:rgba(6,10,24,.72);border:1px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:.25s}
.hs:hover .tag,.hs.active .tag{background:var(--c);color:#06101c}
@keyframes ping{0%{transform:scale(.6);opacity:.95}100%{transform:scale(1.8);opacity:0}}

/* ---------- Bảng thông tin ---------- */
.info{position:fixed;right:16px;top:76px;bottom:92px;width:min(390px,calc(100vw - 32px));z-index:40;overflow:auto;padding:20px 20px 24px;
  transform:translateX(calc(100% + 28px));opacity:0;transition:transform .5s cubic-bezier(.2,.85,.2,1),opacity .4s;pointer-events:none}
.info.open{transform:none;opacity:1;pointer-events:auto}
.info::-webkit-scrollbar{width:6px}.info::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:9px}
.x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.06);
  color:#fff;cursor:pointer;font-size:15px;z-index:2}
.x:hover{background:rgba(255,255,255,.16)}
.i-head{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-right:34px}
.i-ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;
  background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 50%,transparent)}
.i-tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700}
.info h2{font-size:21px;line-height:1.2;font-weight:800;margin-top:2px}
.info h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.i-sum{font-size:14.5px;line-height:1.6;color:#d6e4ff}
.info ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.info li{font-size:13.5px;line-height:1.55;padding-left:18px;position:relative;color:#cddcf5}
.info li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.analog,.fact{margin-top:16px;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.55}
.analog{background:rgba(255,178,58,.09);border:1px solid rgba(255,178,58,.3)}
.analog.hot{background:rgba(255,140,40,.2);border-color:#ffb23a;box-shadow:0 0 22px rgba(255,150,50,.25)}
.fact{background:rgba(53,242,255,.07);border:1px solid rgba(53,242,255,.25)}
.analog span,.fact span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.analog span{color:#ffc46a}.fact span{color:var(--cyan)}

/* ---------- Đố vui ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(2,4,12,.62);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{position:relative;width:min(660px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;transform:translateY(24px) scale(.97);transition:transform .4s cubic-bezier(.2,.9,.2,1)}
.modal.open .modal-card{transform:none}
.q-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding-right:40px}
.q-dots{display:flex;gap:6px}
.q-dots i{width:34px;height:6px;border-radius:9px;background:rgba(255,255,255,.14)}
.q-dots i.done{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.q-dots i.cur{background:var(--mag);box-shadow:0 0 10px var(--mag)}
.q-score{font-weight:700;font-size:13px;color:var(--amber)}
.q-topic{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mag);font-weight:700}
.q-text{font-size:19px;line-height:1.45;font-weight:700;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--text);
  padding:13px 14px;border-radius:14px;cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.45;transition:.2s}
.opt b{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:13px}
.opt:not(:disabled):hover{background:rgba(255,255,255,.11);border-color:var(--cyan);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.right{background:rgba(70,230,130,.18);border-color:#46e682;box-shadow:0 0 20px rgba(70,230,130,.3)}
.opt.right b{background:#46e682;color:#042010}
.opt.wrong{background:rgba(255,80,90,.16);border-color:#ff5a64;box-shadow:0 0 20px rgba(255,80,90,.25)}
.opt.wrong b{background:#ff5a64;color:#2a0408}
.fb{margin-top:14px;border-radius:14px;padding:13px 15px;font-size:14px;line-height:1.55;animation:pop .35s ease}
.fb.ok{background:rgba(70,230,130,.12);border:1px solid rgba(70,230,130,.4)}
.fb.no{background:rgba(255,80,90,.11);border:1px solid rgba(255,90,100,.4)}
.fb strong{display:block;margin-bottom:4px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;padding:11px 20px;border-radius:12px;color:#06101c;
  background:linear-gradient(120deg,var(--cyan),#7aa8ff);box-shadow:0 0 18px rgba(53,242,255,.4)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid var(--stroke)}
.btn:hover{filter:brightness(1.12)}
.res{text-align:center;padding:10px 0 4px}
.res .big{font-size:56px;font-weight:800;background:linear-gradient(120deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.res p{color:#cddcf5;line-height:1.6;margin-top:8px}
.res .best{color:var(--amber);font-size:13px;margin-top:6px}

/* ---------- Toast & loader ---------- */
.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);z-index:35;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(10,16,34,.85);border:1px solid var(--stroke);opacity:0;pointer-events:none;transition:.4s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#16294a,#0b1628 70%);transition:opacity .8s,visibility .8s}
#loader.hide{opacity:0;visibility:hidden}
.ring{width:74px;height:74px;border-radius:50%;margin:0 auto 22px;border:3px solid rgba(53,242,255,.16);border-top-color:var(--cyan);border-right-color:var(--mag);animation:spin 1s linear infinite;box-shadow:0 0 30px rgba(53,242,255,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.l-msg{max-width:420px;padding:0 20px;color:var(--muted);line-height:1.6;font-size:14px}
.l-msg b{color:#fff;display:block;font-size:17px;margin-bottom:6px;letter-spacing:.04em}
#loader.error .ring{animation:none;border-color:#ff5a64}

/* ---------- Di động ---------- */
@media (max-width:760px){
  .brand{left:12px;top:10px}.brand .logo{width:36px;height:36px;font-size:18px;border-radius:11px}.brand h1{font-size:16px}.brand p{display:none}
  .modes{top:56px}.modes button{padding:9px 13px;font-size:13px}
  .l-long,.t-long{display:none}.l-short,.t-short{display:inline}
  .legend{display:none}
  .controls{flex-wrap:wrap;justify-content:center;width:calc(100vw - 16px)}
  .tg{padding:8px 9px;font-size:12.5px}.tg .sw{display:none}
  .tg[aria-pressed="true"]{border-color:var(--cyan);background:rgba(53,242,255,.15)}
  .info{left:10px;right:10px;top:auto;bottom:calc(112px + var(--sb));width:auto;max-height:46vh;transform:translateY(130%);padding:16px}
  .info.open{transform:none}
  .toast{top:108px}
  .q-text{font-size:17px}.modal-card{padding:18px}
}

/* ===== Bảng màu ĐẬM, không neon ===== */
:root{--bg:#0b1628;--cyan:#2f9fd8;--mag:#c43d86;--amber:#e0912a;--lime:#3c9d4a;--red:#d0452c;
 --panel:rgba(12,24,44,.93);--stroke:rgba(150,185,225,.32);--text:#f2f6fc;--muted:#b9c8e0}
.vignette{background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.3) 100%)}
.panel{box-shadow:0 8px 26px rgba(0,0,0,.4)}
.brand .logo{background:linear-gradient(135deg,#b8337a,#2a7fc0);box-shadow:0 3px 12px rgba(0,0,0,.45)}
.brand h1{text-shadow:none}
.modes button.active{color:#fff;background:linear-gradient(120deg,#1f78b4,#2f62c4);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.modes button[data-mode="2"].active{background:linear-gradient(120deg,#c26a0a,#b23a1f);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.tg[aria-pressed="true"] .sw{background:#2a7fc0}
.tg[aria-pressed="true"] .sw::after{box-shadow:none}
.tg.quiz{background:linear-gradient(120deg,#a02a6d,#5b3fb5);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.legend i{box-shadow:none}
.hs .dot{box-shadow:0 0 0 2px rgba(0,0,0,.45)}
.hs .tag{background:rgba(8,16,32,.93);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.hs:hover .tag,.hs.active .tag{color:#fff}
.i-ico{box-shadow:none}.info li::before{box-shadow:none}
.analog{background:rgba(217,130,15,.16);border-color:rgba(217,130,15,.55)}
.analog.hot{background:rgba(217,130,15,.28);border-color:#d9820f;box-shadow:none}
.fact{background:rgba(47,159,216,.14);border-color:rgba(47,159,216,.5)}
.analog span{color:#f0b25a}.fact span{color:#6cc0ec}
.q-dots i.done{background:#2f9fd8;box-shadow:none}.q-dots i.cur{background:#c43d86;box-shadow:none}
.opt.right{background:rgba(40,160,90,.28);border-color:#2fa862;box-shadow:none}.opt.right b{background:#2fa862;color:#fff}
.opt.wrong{background:rgba(200,50,60,.28);border-color:#d0404a;box-shadow:none}.opt.wrong b{background:#d0404a;color:#fff}
.btn{color:#fff;background:linear-gradient(120deg,#1f78b4,#2f62c4);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none}
.ring{box-shadow:none}
@media (max-width:760px){.tg[aria-pressed="true"]{border-color:#2f9fd8;background:rgba(47,159,216,.3)}}

/* ===== Nhãn gọn: chỉ hiện biểu tượng, tên chỉ hiện khi chạm ===== */
.hs .dot{width:30px;height:30px;left:-15px;top:-15px;display:grid;place-items:center;font-size:15px;line-height:1;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.92),0 3px 8px rgba(0,0,0,.5)}
.hs .dot::before{display:none}.hs .dot::after{inset:-6px}
.hs .hit{position:absolute;left:-24px;top:-24px;width:48px;height:48px;border-radius:50%;pointer-events:none;cursor:pointer}
.hs.on .hit{pointer-events:auto}
.hs .tag{left:24px;top:-15px;opacity:0;transform:translateX(-6px) scale(.9);transform-origin:left center;pointer-events:none!important}
.hs.active .tag,.hs:hover .tag{opacity:1;transform:none}
.hs.flip .tag{left:auto;right:24px;transform-origin:right center}
.controls,.legend{transition:opacity .35s}
body.focus .controls,body.focus .legend{opacity:0;pointer-events:none}
@media (max-width:760px){
 .info{bottom:calc(12px + var(--sb));max-height:40vh;padding:14px 16px 18px}
 .i-head{margin-bottom:8px}.i-ico{width:42px;height:42px;font-size:21px}
 .info h2{font-size:18px}.info h3{margin:10px 0 6px}.i-sum{font-size:13.5px}.info li{font-size:13px}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<canvas id="scene" tabindex="0"></canvas>
<div class="vignette"></div>
<div id="labels"></div>

<header class="brand">
  <div class="logo">⚡</div>
  <div><h1>TI THỂ</h1><p>Nhà máy năng lượng của tế bào</p></div>
</header>

<nav class="modes panel" id="modes" aria-label="Chế độ xem">
  <button class="active" data-mode="1"><span class="ico">🧬</span><span class="l-long">Cấu trúc sinh học 3D</span><span class="l-short">Sinh học 3D</span></button>
  <button data-mode="2"><span class="ico">🏭</span><span class="l-long">Nhà máy năng lượng</span><span class="l-short">Nhà máy</span></button>
</nav>
<div class="toast" id="toast"></div>

<aside class="info panel" id="info" aria-live="polite">
  <button class="x" id="infoClose" aria-label="Đóng bảng thông tin">✕</button>
  <div id="infoBody"></div>
</aside>

<div class="controls panel" id="controls">
  <button class="tg" id="tgSpin" aria-pressed="true"><span>🔄</span><span class="t-long">Tự động xoay</span><span class="t-short">Tự xoay</span><i class="sw"></i></button>
  <button class="tg" id="tgLabels" aria-pressed="true"><span>🏷️</span><span class="t-long">Nhãn chú thích</span><span class="t-short">Nhãn</span><i class="sw"></i></button>
  <button class="tg" id="tgCut" aria-pressed="true"><span>✂️</span><span class="t-long">Mặt cắt</span><span class="t-short">Cắt</span><i class="sw"></i></button>
  <button class="tg" id="tgFx" aria-pressed="true"><span>✨</span><span class="t-long">Dòng e⁻ / H⁺</span><span class="t-short">Hạt</span><i class="sw"></i></button>
  <button class="tg quiz" id="btnQuiz"><span>🧠</span><span>Đố vui</span></button>
</div>

<div class="legend panel">
  <div><i style="--c:#2a8fd0"></i>Electron (e⁻)</div>
  <div><i style="--c:#d9481f"></i>Proton (H⁺)</div>
  <div><i style="--c:#e0a000"></i>Phân tử ATP</div>
  <small>Kéo chuột: xoay · Cuộn / chụm: thu phóng · Bấm vào các điểm sáng để xem chi tiết</small>
</div>

<div class="modal" id="quiz" aria-hidden="true">
  <div class="modal-card panel">
    <button class="x" id="quizClose" aria-label="Đóng đố vui">✕</button>
    <div id="quizBody"></div>
  </div>
</div>

<div id="loader"><div><div class="ring"></div><div class="l-msg"><b>Đang khởi động nhà máy năng lượng…</b>Đang tải thư viện Three.js và dựng mô hình ti thể 3D.</div></div></div>

<script type="module">
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];
const loader = $('#loader');
function showError(html) {
  loader.classList.remove('hide');
  loader.classList.add('error');
  $('.l-msg', loader).innerHTML = html;
}

/* =====================================================================
   NỘI DUNG GIÁO DỤC (Tiếng Việt)
   ===================================================================== */

  const lerp = (a, b, t) => a + (b - a) * t;

  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const pm = (a, b) => ((a % b) + b) % b;
  const rng = (() => { let a = 20261111; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;

  const scene = new THREE.Scene();

  scene.fog = new THREE.FogExp2(0x0b1628, 0.011);

  const skyU = { uM: { value: 0 }, uTopA: { value: new Color(0x0b1628) }, uBotA: { value: new Color(0x0b1628) },

  const sky = new Mesh(new THREE.SphereGeometry(200, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float uM, uT; uniform vec3 uTopA, uBotA, uTopB, uBotB, uSil; varying vec3 vD;
      float hs(float n){ return fract(sin(n * 91.7) * 4375.5); }
      float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5); }
      float nz(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(h2(i), h2(i + vec2(1.0, 0.0)), f.x), mix(h2(i + vec2(0.0, 1.0)), h2(i + vec2(1.0, 1.0)), f.x), f.y); }
      float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * nz(p); p *= 2.03; a *= 0.5; } return v; }
      vec2 city(float az, float h, float cells, float hMax, float seed){
        float u = az * cells, id = floor(u), f = fract(u);
        float bh = hMax * (0.25 + 0.75 * hs(id + seed));
        bh += hMax * 0.16 * step(0.7, hs(id + seed + 9.0)) * step(abs(f - 0.3), 0.18);
        float ch = step(0.9, hs(id + seed + 5.0)) * step(abs(f - 0.5), 0.06);
        bh = max(bh, ch * hMax * 2.4);
        float mk = 1.0 - smoothstep(bh - 0.0015, bh, h);
        vec2 wc = vec2(f * 7.0, h * 260.0);
        float win = step(0.74, h2(floor(wc) + id * 3.1 + seed)) * step(0.2, fract(wc.x)) * step(0.25, fract(wc.y)) * step(h, bh - 0.004) * step(0.004, h) * (1.0 - ch);
        return vec2(mk, win * mk);

      void main(){

        vec3 sd = normalize(vec3(0.55, 0.12, -0.83)); float s = max(dot(d, sd), 0.0);

        b += wl * (c1.y * 0.12 * (1.0 - c2.x) * (1.0 - c3.x) + c2.y * 0.25 * (1.0 - c3.x));
        b = mix(b, uSil + uBotB * 0.1 * exp(-max(-h, 0.0) * 6.0), c3.x);

  const uTime = { value: 0 };

  const L_OUT = 4.2, R_OUT = 1.95, L_IN = 3.85, R_IN = 1.62, PN = 2.6;
  const CR = { n: 7, w: 0.04, depth: 0.6 };
  const cristaT = Array.from({ length: CR.n }, (_, k) => -0.75 + k * 0.25);
  const profile = t => { const a = Math.abs(t); return a >= 1 ? 0 : Math.pow(1 - Math.pow(a, PN), 1 / PN); };

  function foldDepth(t, th) {
    let d = 0; const s = Math.sin(th);
    for (let k = 0; k < CR.n; k++) {
      const dt = (t - cristaT[k]) / CR.w;
      if (dt > 2 || dt < -2) continue;
      const g = Math.exp(-dt * dt * dt * dt);
      const side = (k % 2 === 0) ? s : -s;
      const mask = smooth(-0.12, 0.5, side);

    fn(t, th + 2e-3, _p1); fn(t, th - 2e-3, _p2); _d2.subVectors(_p1, _p2);
    return N.crossVectors(_d1, _d2).normalize();

  function buildSurface(fn, nT, nTh, withFold) {

    const pos = new Float32Array(vc * 3), uv = new Float32Array(vc * 2);
    const fold = withFold ? new Float32Array(vc) : null;
    const v = new Vector3();
    for (let i = 0; i <= nT; i++) {
      const t = -1 + 2 * i / nT;
      for (let j = 0; j <= nTh; j++) {
        const th = j / nTh * TAU, o = i * (nTh + 1) + j;

        uv[o * 2] = i / nT; uv[o * 2 + 1] = j / nTh;
        if (fold) fold[o] = foldDepth(t, th);

    const idx = [];
    for (let i = 0; i < nT; i++) for (let j = 0; j < nTh; j++) {
      const a = i * (nTh + 1) + j, b = a + 1, c = a + nTh + 1, d = c + 1;

    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

    g.setIndex(idx);
    g.computeVertexNormals();
    const n = g.attributes.normal;
    for (let i = 0; i <= nT; i++) {
      const a = i * (nTh + 1), b = a + nTh;
      let x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);

    for (let j = 0; j <= nTh; j++) { n.setXYZ(j, -1, 0, 0); n.setXYZ(nT * (nTh + 1) + j, 1, 0, 0); }

  const shellVS = withFold => `

  /* ---------- Sprite phát sáng dùng chung ---------- */

    varying float vA;
    void main(){

  }

  // enzyme / chất tan trong chất nền
  {

  /* =================================================================

  class HelixCurve extends THREE.Curve {
    constructor(R, a, turns, phase) { super(); this.R = R; this.a = a; this.turns = turns; this.phase = phase; }
    getPoint(u, target = new Vector3()) {

      const ca = Math.cos(ang), sa = Math.sin(ang);

  }
  function applyFocus() {
    if (!dims) dims = buildDims();
    for (const r of dims) {
      const f = fKeep && [...r.parts].some(p => fKeep.includes(p)) ? 0 : fAmt, mt = r.mt;
      if (r.kind === 'gain') mt.uniforms.uGain.value = r.base * (1 - 0.8 * f);
      else if (r.kind === 'op') mt.uniforms.uOpacity.value = r.base * (1 - 0.85 * f);

  }

  const state = { auto: true, labels: true, fx: true, cut: true };
  let cutAmt = 0;
  let mLin = 0, mTarget = 0, m = 0, quizOpen = false, selected = null, tween = null;
  const TRANS = 2.8;

  function preset(mode) {
    const asp = innerWidth / innerHeight, f = clamp(1.35 / asp, 1, 2.3);
    if (mode === 1) {
      const t = new Vector3(0.3, 0, 0);
      return { target: t, pos: t.clone().add(new Vector3(0.52, 0.26, 0.81).normalize().multiplyScalar(13.5 * f)) };
    }
    const t = new Vector3(3.8, 0.2, 0);
    return { target: t, pos: t.clone().add(new Vector3(0.34, 0.2, 0.92).normalize().multiplyScalar(19.5 * f)) };
  }
  function startTween(p1, t1, dur) {
    tween = { t: 0, dur, p0: camera.position.clone(), t0: controls.target.clone(), p1, t1 };
    controls.enabled = false;
  }
  function stepTween(dt) {
    if (!tween) return;
    tween.t += dt;
    const k = easeInOut(clamp(tween.t / tween.dur));
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= tween.dur) { tween = null; controls.enabled = true; }
  }
  {
    const p = preset(1);
    camera.position.copy(p.target).addScaledVector(p.pos.clone().sub(p.target), 1.9);
    controls.target.copy(p.target);
    startTween(p.pos, p.target, 3.2);
  }

  const toastEl = $('#toast'); let toastTimer = 0;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600); }

  const modesEl = $('#modes');
  $$('button', modesEl).forEach(b => b.addEventListener('click', () => setMode(+b.dataset.mode)));
  function setMode(n) {
    const tgt = n === 2 ? 1 : 0;
    if (tgt === mTarget) return;
    mTarget = tgt;
    $$('button', modesEl).forEach(b => b.classList.toggle('active', +b.dataset.mode === n));
    closeInfo(true);
    const p = preset(n); startTween(p.pos, p.target, 2.6);
    toast(n === 2 ? '⚡ Đang biến hình: Ti thể → Nhà máy năng lượng…' : '🧬 Đang chuyển về cấu trúc sinh học…');
  }

  const infoEl = $('#info'), infoBody = $('#infoBody');
  function openInfo(h) {
    const d = INFO[h.info], fac = mTarget === 1;
    infoEl.style.setProperty('--c', h.color);
    infoBody.innerHTML = `
      <div class="i-head" style="--c:${h.color}">
        <div class="i-ico">${d.icon}</div>
        <div><div class="i-tag">${fac ? '🏭 ' + h.label : d.tag}</div><h2>${d.name}</h2></div>
      </div>
      <p class="i-sum">${d.summary}</p>
      <h3>Chức năng chính</h3>
      <ul>${d.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <div class="analog ${fac ? 'hot' : ''}"><span>🏭 Ví như nhà máy</span>${d.factory}</div>
      <div class="fact"><span>💡 Bạn có biết?</span>${d.fact}</div>`;
    infoEl.scrollTop = 0; infoEl.classList.add('open');
    selected = h;
  }
  function closeInfo(silent) {
    if (!selected && !infoEl.classList.contains('open')) return;
    infoEl.classList.remove('open'); selected = null;
    fTarget = 0; fKeep = null; fDirty = true; document.body.classList.remove('focus');
    if (!silent) { const q = preset(mTarget === 1 ? 2 : 1); startTween(q.pos, q.target, 1.3); }
  }
  function selectHS(h) {
    openInfo(h);
    fKeep = KEEP[h.info] || null; fTarget = 1; fDirty = true; document.body.classList.add('focus');
    const w = h.anchor.clone(); root.localToWorld(w);
    const asp = clamp(1.35 / camera.aspect, 1, 2.3), big = ['outer', 'inner', 'matrix', 'exhaust'].includes(h.info);
    const dist = (ZOOM[h.info] || 6) * (mTarget === 1 ? 1.5 : 1) * (big ? asp : Math.sqrt(asp));
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.updateMatrixWorld();
    const up = new Vector3().setFromMatrixColumn(camera.matrixWorld, 1), rt = new Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const half = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2), tgt = w.clone();
    if (innerWidth <= 760) tgt.addScaledVector(up, -half * 0.4); else tgt.addScaledVector(rt, half * camera.aspect * 0.32);
    startTween(tgt.clone().addScaledVector(dir, dist), tgt, 1.3);
  }
  $('#infoClose').addEventListener('click', () => closeInfo(false));
  { let d0 = null; const cv = $('#scene');
    cv.addEventListener('pointerdown', e => { d0 = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    cv.addEventListener('pointerup', e => { if (d0 && selected && Math.hypot(e.clientX - d0.x, e.clientY - d0.y) < 6 && performance.now() - d0.t < 500) closeInfo(false); d0 = null; }); }

  function bindToggle(id, key) {
    const b = $(id);
    b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); });
  }
  bindToggle('#tgSpin', 'auto'); bindToggle('#tgLabels', 'labels'); bindToggle('#tgCut', 'cut'); bindToggle('#tgFx', 'fx');

  /* ---------- Đố vui ---------- */
  const quizEl = $('#quiz'), quizBody = $('#quizBody');
  let qz = null;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function bestScore(set) {
    try { if (set !== undefined) { const b = +(localStorage.getItem('mito-best') || 0); if (set > b) localStorage.setItem('mito-best', String(set)); } return +(localStorage.getItem('mito-best') || 0); } catch (e) { return set || 0; }
  }
  function startQuiz() {
    qz = { i: 0, score: 0, locked: false, items: QUIZ.map(q => ({ q: q.q, topic: q.topic, exp: q.exp, opts: shuffle(q.opts.map((t, idx) => ({ t, ok: idx === q.a }))) })) };
    renderQuiz();
  }
  function dotsHTML() { return `<div class="q-dots">${qz.items.map((_, i) => `<i class="${i < qz.i ? 'done' : i === qz.i ? 'cur' : ''}"></i>`).join('')}</div>`; }
  function renderQuiz() {
    if (qz.i >= qz.items.length) {
      const s = qz.score, n = qz.items.length, best = bestScore(s);
      const msg = s === n ? 'Xuất sắc! Bạn xứng đáng là kỹ sư trưởng của nhà máy năng lượng tế bào 🏆'
        : s >= 4 ? 'Rất tốt! Bạn nắm vững hầu hết kiến thức về ti thể 👏'
        : s >= 3 ? 'Khá ổn! Hãy bấm lại các điểm chú thích để củng cố thêm nhé 🔧'
        : 'Đừng nản! Hãy khám phá mô hình 3D và các điểm chú thích rồi thử lại 💪';
      quizBody.innerHTML = `<div class="res"><div class="q-topic">Kết quả</div><div class="big">${s}/${n}</div><p>${msg}</p><div class="best">Điểm cao nhất của bạn: ${best}/${n}</div></div>
        <div class="q-actions"><button class="btn ghost" id="qClose">Đóng</button><button class="btn" id="qAgain">Làm lại</button></div>`;
      $('#qAgain').addEventListener('click', startQuiz); $('#qClose').addEventListener('click', closeQuiz);
      return;
    }
    const it = qz.items[qz.i];
    quizBody.innerHTML = `
      <div class="q-top">${dotsHTML()}<div class="q-score">Điểm: ${qz.score}/${qz.items.length}</div></div>
      <div class="q-topic">Câu ${qz.i + 1}/${qz.items.length} · ${it.topic}</div>
      <div class="q-text">${it.q}</div>
      <div class="opts">${it.opts.map((o, j) => `<button class="opt"><b>${'ABCD'[j]}</b><span>${o.t}</span></button>`).join('')}</div>
      <div id="qfb"></div><div class="q-actions" id="qact"></div>`;
    $$('.opt', quizBody).forEach((b, idx) => b.addEventListener('click', () => answer(idx)));
  }
  function answer(idx) {

    const it = qz.items[qz.i], ok = it.opts[idx].ok;
    if (ok) qz.score++;
    $$('.opt', quizBody).forEach((b, j) => { b.disabled = true; if (it.opts[j].ok) b.classList.add('right'); else if (j === idx) b.classList.add('wrong'); });
    $('#qfb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><strong>${ok ? '✅ Chính xác!' : '❌ Chưa đúng rồi.'}</strong>${it.exp}</div>`;
    const last = qz.i === qz.items.length - 1;
    $('#qact').innerHTML = `<button class="btn" id="qNext">${last ? 'Xem kết quả' : 'Câu tiếp theo →'}</button>`;
    $('#qNext').addEventListener('click', () => { qz.i++; qz.locked = false; renderQuiz(); });
    $('.q-score', quizBody).textContent = `Điểm: ${qz.score}/${qz.items.length}`;
  }
  function openQuiz() { quizOpen = true; closeInfo(true); startQuiz(); quizEl.classList.add('open'); quizEl.setAttribute('aria-hidden', 'false'); }
  function closeQuiz() { quizOpen = false; quizEl.classList.remove('open'); quizEl.setAttribute('aria-hidden', 'true'); }
  $('#btnQuiz').addEventListener('click', openQuiz);
  $('#quizClose').addEventListener('click', closeQuiz);
  quizEl.addEventListener('click', e => { if (e.target === quizEl) closeQuiz(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (quizOpen) closeQuiz(); else closeInfo(false); } });

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight, false);
    composer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); updScale();
  });

  /* =================================================================
     VÒNG LẶP HOẠT ẢNH
     ================================================================= */
  const clock = new THREE.Clock();
  const tmp = new Vector3(), tmp2 = new Vector3(), _s = new Vector3();
  const cA0 = new Color(0x2a2a8a), cA1 = new Color(0x234a80), cB0 = new Color(0xa8328a), cB1 = new Color(0xc9701a);
  const fill0 = new Color(0x4a6fb8), fill1 = new Color(0xc9801f);
  const key0 = new Color(0xcfe8ff), key1 = new Color(0xffe0b0);
  const lCy0 = new Color(0x4aa3d8), lCy1 = new Color(0xd98a3a);
  let frames = 0;

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = (uTime.value += dt);

    // --- biến hình ---
    if (mLin !== mTarget) {
      mLin += Math.sign(mTarget - mLin) * dt / TRANS;
      mLin = clamp(mLin, 0, 1);
      if (Math.abs(mTarget - mLin) < 1e-3) mLin = mTarget;
    }
    m = easeInOut(mLin);
    { const ct = state.cut ? 1 : 0; cutAmt += (ct - cutAmt) * Math.min(1, dt * 2.5); if (Math.abs(ct - cutAmt) < 0.002) cutAmt = ct; uCutAng.value = easeInOut(cutAmt) * 1.15; }
    const edge = smooth(0, 0.04, mLin) * (1 - smooth(0.96, 1, mLin));

    stepTween(dt);
    controls.autoRotate = state.auto && !tween && !quizOpen && !selected;
    controls.update();

    root.position.y = Math.sin(time * 0.8) * 0.06 * (1 - m);

    // --- shader & màu ---
    const wipe = lerp(-4.9, 4.9, m);
    outerU.uWipe.value = wipe; outerU.uEdge.value = edge;
    innerU.cA.value.copy(cA0).lerp(cA1, m); innerU.cB.value.copy(cB0).lerp(cB1, m);
    fillU.uColor.value.copy(fill0).lerp(fill1, m);
    key.color.copy(key0).lerp(key1, m * 0.6);
    lCy.color.copy(lCy0).lerp(lCy1, m * 0.7);
    skyU.uM.value = m; skyU.uT.value = time; bgFrame(m, time); sky.position.copy(camera.position); scene.fog.color.copy(fog0).lerp(fog1, m);
    bloom.strength = 0.08 + 0.12 * edge;
    pore1.visible = pore2.visible = m < 0.85;
    poreMat1.opacity = poreMat2.opacity = 1 - smooth(0.2, 0.7, m);

    scanRing.position.x = wipe;
    const sr = R_OUT * profile(clamp(wipe / L_OUT, -1, 1)) + 0.14;
    scanRing.scale.setScalar(Math.max(0.02, sr));
    scanRing.visible = edge > 0.01 && Math.abs(wipe) < L_OUT + 0.3;
    scanMat.opacity = edge;

    // --- yếu tố nhà máy ---
    updateAppear(m);
    floor.visible = false;
    smoke.visible = m > 0.6; smokeU.uAmount.value = smooth(0.62, 0.95, m);
    const flick = 0.92 + 0.08 * Math.sin(time * 9) * Math.sin(time * 3.1);
    signMat.color.setScalar(flick);
    lamps.forEach((l, i) => l.scale.setScalar(0.8 + 0.4 * Math.max(0, Math.sin(time * 5 + i * PI))));
    recvRing.scale.setScalar(1 + 0.04 * Math.sin(time * 3)); recvRing2.rotation.x = time * 1.6;
    beltTex.offset.x = -time * 1.4;
    gearSets.forEach(({ gs, rot0 }) => {
      const base = time * 0.45;
      gs[0].rotation.z = rot0[0] + base;
      gs[1].rotation.z = rot0[1] - base * GN[0] / GN[1];
      gs[2].rotation.z = rot0[2] + base * GN[0] / GN[2];
    });

    // --- ribosome ---
    for (let i = 0; i < RIB_N; i++) {
      const b = ribBase[i], ph = ribPh[i], s = ribS[i];
      tmp.set(b.x + 0.04 * Math.sin(time * 0.6 + ph), b.y + 0.04 * Math.cos(time * 0.5 + ph * 1.3), b.z + 0.04 * Math.sin(time * 0.7 + ph * 0.7));
      dummy.position.copy(tmp); dummy.quaternion.identity(); dummy.scale.setScalar(s); dummy.updateMatrix(); ribLarge.setMatrixAt(i, dummy.matrix);
      dummy.position.copy(tmp).addScaledVector(ribDir[i], 0.055 * s); dummy.updateMatrix(); ribSmall.setMatrixAt(i, dummy.matrix);
    }
    ribLarge.instanceMatrix.needsUpdate = true; ribSmall.instanceMatrix.needsUpdate = true;

    // --- ATP synthase ---
    for (let i = 0; i < SN; i++) {
      const s = syn[i]; s.flash = Math.max(0, s.flash - dt * 1.6);
      dummy.quaternion.copy(s.q);
      dummy.position.copy(s.P).addScaledVector(s.Nin, 0.165); dummy.scale.setScalar(1 + 0.45 * s.flash); dummy.updateMatrix(); synHead.setMatrixAt(i, dummy.matrix);
      tmpQ.setFromAxisAngle(Y, time * 5 + s.ph); dummy.quaternion.copy(s.q).multiply(tmpQ);
      dummy.position.copy(s.P).addScaledVector(s.Nin, 0.228); dummy.scale.setScalar(1 + 0.3 * s.flash); dummy.updateMatrix(); synRotor.setMatrixAt(i, dummy.matrix);
    }
    synHead.instanceMatrix.needsUpdate = true; synRotor.instanceMatrix.needsUpdate = true;

    // --- electron & proton ---
    electrons.points.visible = protons.points.visible = state.fx;
    if (state.fx) {
      for (let i = 0; i < EL_N; i++) {
        const e = elData[i], w = pm(e.ph + time * e.sp * e.dir, 1);
        innerP(e.t, lerp(e.th0, e.th1, w), tmp);
        electrons.pos[i * 3] = tmp.x; electrons.pos[i * 3 + 1] = tmp.y; electrons.pos[i * 3 + 2] = tmp.z;
        electrons.a[i] = Math.pow(Math.sin(PI * w), 0.6) * (0.75 + 0.25 * Math.sin(time * 8 + i));
      }
      electrons.g.attributes.position.needsUpdate = true; electrons.g.attributes.aA.needsUpdate = true;
      for (let i = 0; i < PR_N; i++) {
        const p = prData[i], w = pm(p.ph + time * p.sp, 1); let a = 1;
        if (w < 0.22) { const u = w / 0.22; tmp.lerpVectors(p.A, p.B, smooth(0, 1, u)); a = smooth(0, 0.2, u); }
        else if (w < 0.62) {
          const u = (w - 0.22) / 0.4; tmp.lerpVectors(p.B, p.C, easeInOut(u));
          tmp.x += 0.025 * Math.sin(u * 9 + p.ph * 20); tmp.y += 0.025 * Math.cos(u * 8 + p.ph * 13); tmp.z += 0.025 * Math.sin(u * 7 + p.ph * 31);
        } else { const u = (w - 0.62) / 0.38; tmp.lerpVectors(p.C, p.D, easeInOut(u)); a = 1 - smooth(0.8, 1, u); }
        protons.pos[i * 3] = tmp.x; protons.pos[i * 3 + 1] = tmp.y; protons.pos[i * 3 + 2] = tmp.z; protons.a[i] = a;
      }
      protons.g.attributes.position.needsUpdate = true; protons.g.attributes.aA.needsUpdate = true;
    }

    // --- đồng xu ATP ---
    updatePath(m);
    const speed = lerp(1.1, 1.4, m);
    for (const c of coins) {
      PP[0].copy(c.start);
      let tot = 0; for (let i = 0; i < 4; i++) { seg[i] = PP[i].distanceTo(PP[i + 1]); tot += seg[i]; }
      c.u += speed * dt / Math.max(tot, 0.001);
      if (c.u >= 1) { c.u = 0; pickStart(c, true); PP[0].copy(c.start); }
      let d = c.u * tot, i = 0;
      while (i < 3 && d > seg[i]) { d -= seg[i]; i++; }
      c.g.position.lerpVectors(PP[i], PP[i + 1], seg[i] > 0 ? clamp(d / seg[i]) : 0);
      c.g.position.y += 0.03 * Math.sin(time * 3 + c.ph) * (1 - m);
      c.g.rotation.y = time * 1.3 + c.ph;
      const sc = smooth(0, 0.06, c.u) * (1 - smooth(0.92, 1, c.u));

    }

    // --- nền ---
    dust.rotation.y += dt * 0.01;

    // --- nhãn 3D ---
    const w = innerWidth, h = innerHeight, act = [];
    for (const d of HS) {
      const vis = d.mode === 1 ? 1 - m : m;
      const show = state.labels && vis > 0.92 && !quizOpen && (!selected || selected === d);
      d.el.classList.toggle('on', show);
      d.el.classList.toggle('active', selected === d);
      if (vis < 0.02) continue;
      d.world.copy(d.anchor); root.localToWorld(d.world);
      _s.copy(d.world).project(camera);
      if (_s.z > 1 || _s.z < -1) { d.el.style.visibility = 'hidden'; continue; }
      d.el.style.visibility = 'visible'; d.el.classList.toggle('flip', _s.x > 0.1);
      d.sx = (_s.x * .5 + .5) * w; d.sy = (-_s.y * .5 + .5) * h; if (show) act.push(d); else d.el.style.transform = `translate3d(${d.sx.toFixed(1)}px,${d.sy.toFixed(1)}px,0)`;
    }

    for (let it = 0; it < 4; it++) for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      const a = act[i], b = act[j]; let dx = b.sx - a.sx, dy = b.sy - a.sy, dd = Math.hypot(dx, dy);
      if (dd < 46) { if (dd < 0.01) { dx = 1; dy = 0; dd = 1; } const k = (46 - dd) / 2 / dd; a.sx -= dx * k; a.sy -= dy * k; b.sx += dx * k; b.sy += dy * k; }
    }
    act.forEach(d => { d.el.style.transform = `translate3d(${d.sx.toFixed(1)}px,${d.sy.toFixed(1)}px,0)`; });
    fAmt += (fTarget - fAmt) * Math.min(1, dt * 4); if (Math.abs(fTarget - fAmt) < 0.003) fAmt = fTarget;
    if (fDirty || fAmt !== fTarget) { try { applyFocus(); } catch (e) { console.error(e); } if (fAmt === fTarget) fDirty = false; }
    composer.render();
    if (++frames === 8) setTimeout(() => { loader.classList.add('hide'); toast('👆 Chạm vào các biểu tượng để xem chi tiết'); }, 350);
  }
  frame();
}

try {
  const [THREE, oc, ec, rp, ub, op, re] = await Promise.all([
    import('three'),
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/postprocessing/EffectComposer.js'),

    import('three/addons/postprocessing/OutputPass.js'),

  } catch (err) {

    showError('<b>Có lỗi khi dựng mô hình</b>' + String(err && err.message || err) + '<br>Hãy thử tải lại trang hoặc dùng trình duyệt mới hơn.');
  }
} catch (err) {
  console.error(err);
  showError('<b>Không tải được thư viện Three.js</b>Tệp này cần kết nối Internet để tải Three.js từ CDN (jsdelivr). Hãy kiểm tra mạng rồi mở lại tệp bằng Chrome, Edge, Firefox hoặc Safari.');
}
